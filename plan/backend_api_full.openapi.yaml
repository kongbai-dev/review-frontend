components:
  schemas:
    AssignmentRequest:
      properties:
        qa_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Qa Ids
        assignee:
          type: string
          maxLength: 64
          minLength: 1
          title: Assignee
      type: object
      required:
      - qa_ids
      - assignee
      title: AssignmentRequest
    AssignmentResponse:
      properties:
        updated_count:
          type: integer
          title: Updated Count
        assignee:
          type: string
          title: Assignee
        assignee_user_id:
          type: integer
          title: Assignee User Id
      type: object
      required:
      - updated_count
      - assignee
      - assignee_user_id
      title: AssignmentResponse
    BatchSyncStartRequest:
      properties:
        min_batch_size:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Min Batch Size
          default: 10
        max_wait_seconds:
          type: integer
          maximum: 86400.0
          minimum: 0.0
          title: Max Wait Seconds
          default: 300
        max_docs:
          type: integer
          maximum: 2000.0
          minimum: 1.0
          title: Max Docs
          default: 200
        max_workers:
          type: integer
          maximum: 64.0
          minimum: 1.0
          title: Max Workers
          default: 8
        include_failed:
          type: boolean
          title: Include Failed
          default: true
        knowledge_base:
          type: string
          title: Knowledge Base
          default: default
        strict_pairing:
          type: boolean
          title: Strict Pairing
          default: false
      type: object
      title: BatchSyncStartRequest
    BatchSyncStartResponse:
      properties:
        task_id:
          type: string
          title: Task Id
        status:
          type: string
          title: Status
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        queued_count:
          type: integer
          title: Queued Count
        processed_count:
          type: integer
          title: Processed Count
        success_count:
          type: integer
          title: Success Count
        failed_count:
          type: integer
          title: Failed Count
        skipped_count:
          type: integer
          title: Skipped Count
          default: 0
        message:
          type: string
          title: Message
      type: object
      required:
      - task_id
      - status
      - queued_count
      - processed_count
      - success_count
      - failed_count
      - message
      title: BatchSyncStartResponse
    BatchSyncTaskStatusResponse:
      properties:
        task_id:
          type: string
          title: Task Id
        status:
          type: string
          title: Status
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        queued_count:
          type: integer
          title: Queued Count
        processed_count:
          type: integer
          title: Processed Count
        success_count:
          type: integer
          title: Success Count
        failed_count:
          type: integer
          title: Failed Count
        skipped_count:
          type: integer
          title: Skipped Count
          default: 0
        message:
          type: string
          title: Message
          default: ''
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        failed_documents:
          items:
            type: string
          type: array
          title: Failed Documents
        skipped_documents:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Skipped Documents
      type: object
      required:
      - task_id
      - status
      - queued_count
      - processed_count
      - success_count
      - failed_count
      title: BatchSyncTaskStatusResponse
    BatchUploadFileItem:
      properties:
        file_name:
          type: string
          title: File Name
        status:
          type: string
          title: Status
        message:
          type: string
          title: Message
          default: ''
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        csv_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Csv Id
      type: object
      required:
      - file_name
      - status
      title: BatchUploadFileItem
    BatchUploadResponse:
      properties:
