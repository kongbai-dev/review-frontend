openapi: 3.1.0
info:
  title: AI TCAD Review Backend - Documents API
  version: '2026-04-13'
  description: OpenAPI contract for review workbench document APIs (sync upload +
    batch upload/sync + QA generation).
paths:
  /api/v1/knowledge/documents/stats:
    get:
      tags:
      - v1-documents
      summary: Document Stats
      operationId: document_stats_api_v1_knowledge_documents_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatsResponse'
      security:
      - HTTPBearer: []
  /api/v1/knowledge/documents:
    get:
      tags:
      - v1-documents
      summary: List Documents
      operationId: list_documents_api_v1_knowledge_documents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 20
          title: Page Size
      - name: file_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: File Type
      - name: document_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Keyword
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          default: uploaded_at
          title: Sort By
      - name: order
        in: query
        required: false
        schema:
          type: string
          default: desc
          title: Order
      - name: knowledge_base
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Knowledge Base
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - v1-documents
      summary: Upload Document
      operationId: upload_document_api_v1_knowledge_documents_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_api_v1_knowledge_documents_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/knowledge/documents/{document_id}:
    get:
      tags:
      - v1-documents
      summary: Get Document
      operationId: get_document_api_v1_knowledge_documents__document_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - v1-documents
      summary: Delete Document
      operationId: delete_document_api_v1_knowledge_documents__document_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/knowledge/documents/{document_id}/download:
    get:
      tags:
      - v1-documents
      summary: Download Document
      operationId: download_document_api_v1_knowledge_documents__document_id__download_get
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/knowledge/documents/batch-upload/doc-files:
    post:
      tags:
      - v1-documents
      summary: Batch Upload Doc Files
      operationId: batch_upload_doc_files_api_v1_knowledge_documents_batch_upload_doc_files_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_batch_upload_doc_files_api_v1_knowledge_documents_batch_upload_doc_files_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/knowledge/documents/batch-upload/csv-files:
    post:
      tags:
      - v1-documents
      summary: Batch Upload Csv Files
      operationId: batch_upload_csv_files_api_v1_knowledge_documents_batch_upload_csv_files_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_batch_upload_csv_files_api_v1_knowledge_documents_batch_upload_csv_files_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/knowledge/documents/batch-upload/session/current:
    get:
      tags:
      - v1-documents
      summary: Get Current Batch Upload Session
      operationId: get_current_batch_upload_session_api_v1_knowledge_documents_batch_upload_session_current_get
      security:
      - HTTPBearer: []
      parameters:
      - name: knowledge_base
        in: query
        required: false
        schema:
          type: string
          default: default
          title: Knowledge Base
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionSummaryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/knowledge/documents/batch-sync/start:
    post:
      tags:
      - v1-documents
      summary: Start Batch Sync
      operationId: start_batch_sync_api_v1_knowledge_documents_batch_sync_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSyncStartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSyncStartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/knowledge/documents/batch-sync/tasks/{task_id}:
    get:
      tags:
      - v1-documents
      summary: Get Batch Sync Task
      operationId: get_batch_sync_task_api_v1_knowledge_documents_batch_sync_tasks__task_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSyncTaskStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/knowledge/documents/qa-generation/start:
    post:
      tags:
      - v1-documents
      summary: Generate Document Qas
      operationId: generate_document_qas_api_v1_knowledge_documents_qa_generation_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QAGenerationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAGenerationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/knowledge/documents/qa-generation/tasks/{task_id}:
    get:
      tags:
      - v1-documents
      summary: Get Qa Generation Task
      operationId: get_qa_generation_task_api_v1_knowledge_documents_qa_generation_tasks__task_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Qa Generation Task Api V1 Knowledge Documents
                  Qa Generation Tasks  Task Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AssignmentRequest:
      properties:
        qa_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Qa Ids
        assignee:
          type: string
          maxLength: 64
          minLength: 1
          title: Assignee
      type: object
      required:
      - qa_ids
      - assignee
      title: AssignmentRequest
    AssignmentResponse:
      properties:
        updated_count:
          type: integer
          title: Updated Count
        assignee:
          type: string
          title: Assignee
        assignee_user_id:
          type: integer
          title: Assignee User Id
      type: object
      required:
      - updated_count
      - assignee
      - assignee_user_id
      title: AssignmentResponse
    BatchSyncStartRequest:
      properties:
        min_batch_size:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Min Batch Size
          default: 10
        max_wait_seconds:
          type: integer
          maximum: 86400.0
          minimum: 0.0
          title: Max Wait Seconds
          default: 300
        max_docs:
          type: integer
          maximum: 2000.0
          minimum: 1.0
          title: Max Docs
          default: 200
        max_workers:
          type: integer
          maximum: 64.0
          minimum: 1.0
          title: Max Workers
          default: 8
        include_failed:
          type: boolean
          title: Include Failed
          default: true
        knowledge_base:
          type: string
          title: Knowledge Base
          default: default
        strict_pairing:
          type: boolean
          title: Strict Pairing
          default: false
      type: object
      title: BatchSyncStartRequest
    BatchSyncStartResponse:
      properties:
        task_id:
          type: string
          title: Task Id
        status:
          type: string
          title: Status
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        queued_count:
          type: integer
          title: Queued Count
        processed_count:
          type: integer
          title: Processed Count
        success_count:
          type: integer
          title: Success Count
        failed_count:
          type: integer
          title: Failed Count
        skipped_count:
          type: integer
          title: Skipped Count
          default: 0
        message:
          type: string
          title: Message
      type: object
      required:
      - task_id
      - status
      - queued_count
      - processed_count
      - success_count
      - failed_count
      - message
      title: BatchSyncStartResponse
    BatchSyncTaskStatusResponse:
      properties:
        task_id:
          type: string
          title: Task Id
        status:
          type: string
          title: Status
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        queued_count:
          type: integer
          title: Queued Count
        processed_count:
          type: integer
          title: Processed Count
        success_count:
          type: integer
          title: Success Count
        failed_count:
          type: integer
          title: Failed Count
        skipped_count:
          type: integer
          title: Skipped Count
          default: 0
        message:
          type: string
          title: Message
          default: ''
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        failed_documents:
          items:
            type: string
          type: array
          title: Failed Documents
        skipped_documents:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Skipped Documents
      type: object
      required:
      - task_id
      - status
      - queued_count
      - processed_count
      - success_count
      - failed_count
      title: BatchSyncTaskStatusResponse
    BatchUploadFileItem:
      properties:
        file_name:
          type: string
          title: File Name
        status:
          type: string
          title: Status
        message:
          type: string
          title: Message
          default: ''
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        csv_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Csv Id
      type: object
      required:
      - file_name
      - status
      title: BatchUploadFileItem
    BatchUploadResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        knowledge_base:
          type: string
          title: Knowledge Base
        total_files:
          type: integer
          title: Total Files
        accepted_count:
          type: integer
          title: Accepted Count
        rejected_count:
          type: integer
          title: Rejected Count
        items:
          items:
            $ref: '#/components/schemas/BatchUploadFileItem'
          type: array
          title: Items
        paired_count:
          type: integer
          title: Paired Count
          default: 0
        unpaired_count:
          type: integer
          title: Unpaired Count
          default: 0
      type: object
      required:
      - session_id
      - knowledge_base
      - total_files
      - accepted_count
      - rejected_count
      title: BatchUploadResponse
    Body_batch_upload_csv_files_api_v1_knowledge_documents_batch_upload_csv_files_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
        knowledge_base:
          type: string
          title: Knowledge Base
          default: default
      type: object
      required:
      - files
      title: Body_batch_upload_csv_files_api_v1_knowledge_documents_batch_upload_csv_files_post
    Body_batch_upload_doc_files_api_v1_knowledge_documents_batch_upload_doc_files_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
        knowledge_base:
          type: string
          title: Knowledge Base
          default: default
      type: object
      required:
      - files
      title: Body_batch_upload_doc_files_api_v1_knowledge_documents_batch_upload_doc_files_post
    Body_upload_document_api_v1_knowledge_documents_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        metadata_csv:
          type: string
          contentMediaType: application/octet-stream
          title: Metadata Csv
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        document_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        upload_mode:
          type: string
          title: Upload Mode
          default: sync
        knowledge_base:
          type: string
          title: Knowledge Base
          default: default
        subdir:
          anyOf:
          - type: string
          - type: 'null'
          title: Subdir
      type: object
      required:
      - file
      - metadata_csv
      title: Body_upload_document_api_v1_knowledge_documents_post
    DocumentDeleteResponse:
      properties:
        deleted:
          type: boolean
          title: Deleted
        id:
          type: string
          title: Id
      type: object
      required:
      - deleted
      - id
      title: DocumentDeleteResponse
    DocumentDetailResponse:
      properties:
        document_id:
          type: string
          title: Document Id
        title:
          type: string
          title: Title
        file_name:
          type: string
          title: File Name
        source_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Path
        file_type:
          anyOf:
          - type: string
          - type: 'null'
          title: File Type
        file_size:
          type: integer
          title: File Size
          default: 0
        uploaded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Uploaded At
        uploaded_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Uploaded By
        uploaded_by_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Uploaded By Name
        knowledge_base:
          type: string
          title: Knowledge Base
          default: default
        status:
          type: string
          title: Status
          default: indexed
        fragment_count:
          type: integer
          title: Fragment Count
          default: 0
        qa_count:
          type: integer
          title: Qa Count
          default: 0
        document_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
        authors:
          items:
            type: string
          type: array
          title: Authors
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
        journal:
          anyOf:
          - type: string
          - type: 'null'
          title: Journal
        conference:
          anyOf:
          - type: string
          - type: 'null'
          title: Conference
        publisher:
          anyOf:
          - type: string
          - type: 'null'
          title: Publisher
        volume:
          anyOf:
          - type: string
          - type: 'null'
          title: Volume
        issue:
          anyOf:
          - type: string
          - type: 'null'
          title: Issue
        pages:
          anyOf:
          - type: string
          - type: 'null'
          title: Pages
        doi:
          anyOf:
          - type: string
          - type: 'null'
          title: Doi
        abstract:
          anyOf:
          - type: string
          - type: 'null'
          title: Abstract
        topics:
          items:
            type: string
          type: array
          title: Topics
        scenes:
          items:
            type: string
          type: array
          title: Scenes
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        sync_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Sync Mode
        sync_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Sync Status
        local_file_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Local File Path
        local_csv_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Local Csv Path
        upload_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Upload Session Id
        pair_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Pair Status
        pair_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Pair Error
        csv_file_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Csv File Name
        file_md5:
          anyOf:
          - type: string
          - type: 'null'
          title: File Md5
        object_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Object Key
        indexed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Indexed At
        last_error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error Code
        last_error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error Message
        uploaded_by_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Uploaded By User Id
        latest_task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Task Id
        latest_task_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Task Status
        latest_task_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Task Stage
        latest_task_error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Task Error Message
        latest_task_updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Latest Task Updated At
        sync_attempts:
          type: integer
          title: Sync Attempts
          default: 0
        sync_last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Sync Last Error
        minio_uploaded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Minio Uploaded At
        qa_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Qa Status
        csv_md5:
          anyOf:
          - type: string
          - type: 'null'
          title: Csv Md5
      type: object
      required:
      - document_id
      - title
      - file_name
      title: DocumentDetailResponse
    DocumentListItem:
      properties:
        document_id:
          type: string
          title: Document Id
        title:
          type: string
          title: Title
        file_name:
          type: string
          title: File Name
        source_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Path
        file_type:
          anyOf:
          - type: string
          - type: 'null'
          title: File Type
        file_size:
          type: integer
          title: File Size
          default: 0
        uploaded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Uploaded At
        uploaded_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Uploaded By
        uploaded_by_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Uploaded By Name
        knowledge_base:
          type: string
          title: Knowledge Base
          default: default
        status:
          type: string
          title: Status
          default: indexed
        fragment_count:
          type: integer
          title: Fragment Count
          default: 0
        qa_count:
          type: integer
